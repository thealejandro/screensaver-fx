[package]
name = "ssfx-core"
version = "0.1.9"
edition = "2021"
description = "Motor de animaciones de Screensaver FX (rejilla de celdas, sin dependencias de plataforma)"
license = "MIT"
# examples/png.rs es un módulo auxiliar (sin main) que incluyen snap y brand: no es un ejemplo
# y, si cargo lo autodetecta, `cargo test` falla al compilarlo.
autoexamples = false

[[example]]
name = "snap"

[[example]]
name = "brand"

[[example]]
name = "banner"

[[example]]
name = "bench"

[[example]]
name = "desk"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

# Solo para las herramientas de examples/ (snap, brand); no entra en el protector.
[dev-dependencies]
miniz_oxide = "0.8"
