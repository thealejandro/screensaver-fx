# Compila el motor a WebAssembly y publica la web (demo en vivo) en GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar el motor a WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p ssfx-wasm --target wasm32-unknown-unknown

      - name: Preparar el sitio
        run: cp target/wasm32-unknown-unknown/release/ssfx_wasm.wasm web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
