# Compila y prueba en cada cambio; al subir una etiqueta (git tag v0.1.0 && git push --tags) publica la versión.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=0.0.0
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "SSFX_VERSION=$V" >> "$GITHUB_ENV" # update.rs: versión que compara con la última release
          sed -i "s/0\.1\.0/$V/g; s/0,1,0,0/${V//./,},0/g" windows/res/app.rc

      - name: llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R mstorsjo/llvm-mingw -p 'llvm-mingw-*-ucrt-x86_64.zip' -D "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP"/llvm-mingw-*.zip > /dev/null
          echo "$(cygpath -w "$(ls -d "$RUNNER_TEMP"/llvm-mingw-*-ucrt-x86_64)")\\bin" >> "$GITHUB_PATH"

      - name: Compilar x64 y ARM64
        run: |
          rustup target add x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm
          cargo build -p screensaver-fx --release --target x86_64-pc-windows-gnullvm
          cargo build -p screensaver-fx --release --target aarch64-pc-windows-gnullvm

      - name: Pruebas
        run: cargo test -p ssfx-core -p screensaver-fx --release --target x86_64-pc-windows-gnullvm

      # Coste por cuadro de cada efecto (#4): falla si alguno pasa de 4 ms en el p99 (hoy ~0,2 ms).
      - name: Rendimiento
        run: cargo run -p ssfx-core --example bench --release --target x86_64-pc-windows-gnullvm -- 4

      # Solo DLL que trae Windows: una de llvm-mingw (libunwind.dll) solo existe en la máquina que compila.
      - name: Dependencias del sistema
        run: |
          for t in x86_64 aarch64; do
            for d in $(llvm-objdump -p target/$t-pc-windows-gnullvm/release/ScreensaverFX.exe | sed -n 's/.*DLL Name: //p'); do
              case "${d,,}" in api-ms-win-*) continue ;; esac
              [ -f "/c/Windows/System32/$d" ] || { echo "::error::$t depende de $d, que no viene con Windows"; exit 1; }
            done
          done

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DAppVersion=$env:VERSION" `
            "/DX64Bin=$PWD\target\x86_64-pc-windows-gnullvm\release\ScreensaverFX.exe" `
            "/DArm64Bin=$PWD\target\aarch64-pc-windows-gnullvm\release\ScreensaverFX.exe" `
            installer\windows\ScreensaverFX.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "dist\ScreensaverFX-Setup-$env:VERSION.exe" dist\ScreensaverFX-Setup.exe
          # .scr suelto para quien prefiera instalarlo a mano (clic derecho › Instalar).
          Copy-Item target\x86_64-pc-windows-gnullvm\release\ScreensaverFX.exe dist\ScreensaverFX-x64.scr
          Copy-Item target\aarch64-pc-windows-gnullvm\release\ScreensaverFX.exe dist\ScreensaverFX-arm64.scr

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=0.0.0
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" macos/Info.plist

      - name: Pruebas
        run: cargo test -p ssfx-core --release

      - name: Rendimiento
        run: cargo run -p ssfx-core --example bench --release -- 4

      - name: Compilar y empaquetar
        run: ./macos/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas
        run: cargo test -p ssfx-core -p ssfx-term --release

      # Enlazado estático con musl: el mismo binario sirve en cualquier distribución.
      - name: Compilar
        run: |
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
          cargo build -p ssfx-term --release --target ${{ matrix.arch }}-unknown-linux-musl
          mkdir -p dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/screensaver-fx dist/screensaver-fx-linux-${{ matrix.arch }}

      - name: QA en una pseudoterminal
        run: |
          BIN="$PWD/dist/screensaver-fx-linux-${{ matrix.arch }}"
          ! ldd "$BIN" 2>/dev/null | grep -q '=>' || { echo "::error::el binario no es estático"; exit 1; }
          [ "$("$BIN" --list | wc -l)" -ge 29 ]
          "$BIN" --banner "QA" "linux" --font shadow | grep -q '█'
          # 2,2 s: el núcleo garantiza (y prueba) que todo efecto ha pintado algo a los 2 s; con
          # menos, los que arrancan con retardo al azar (beams) pueden no haber empezado.
          export SCREENSAVER_FX_SEED=qa
          for fx in $("$BIN" --list); do
            script -qec "stty cols 120 rows 40; '$BIN' $fx --seconds 2.2" /dev/null > "$RUNNER_TEMP/out.raw" || { echo "::error::falla el efecto $fx"; exit 1; }
            grep -q '38;2;' "$RUNNER_TEMP/out.raw" || { echo "::error::el efecto $fx no pinta nada"; exit 1; }
          done
          for f in linux/install.sh linux/uninstall.sh linux/omarchy/bin/ttfx linux/omarchy/bin/omarchy-screensaver linux/omarchy/screensaver-check.sh; do bash -n "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  qa-windows:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: QA del instalador
        shell: pwsh
        run: ./.github/qa/windows.ps1 -Setup dist/ScreensaverFX-Setup.exe

  qa-macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - name: QA de los paquetes
        run: bash .github/qa/macos.sh dist

  release:
    needs: [windows, macos, linux, qa-windows, qa-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 install.sh dist/
          # Sin las copias con versión del .dmg y el .pkg: en la lista basta un archivo de cada tipo.
          rm -f dist/ScreensaverFX-[0-9]*.dmg dist/ScreensaverFX-[0-9]*.pkg
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # Tabla de qué descargar según el equipo y los cambios desde el release anterior.
          bash .github/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Screensaver FX ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
