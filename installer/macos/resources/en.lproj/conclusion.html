<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, "Helvetica Neue", sans-serif; line-height: 1.5; margin: 0 4px; }
  h1 { font-size: 20px; margin: 4px 0 2px; color: #9ece6a; }
  .sub { opacity: .65; margin: 0 0 14px; }
  li { margin: 3px 0; }

<h1>All set!</h1>
<p class="sub">Screensaver FX is installed.</p>
<ol>
  <li>Open <b>System Settings › Screen Saver</b>.</li>
  <li>Pick <b>Screensaver FX</b> under “Other”.</li>
  <li>Click <b>Options…</b> to change the banner, colors and effects.</li>
</ol>
<p>To uninstall: right-click it in Screen Saver › <b>Delete</b>.</p>
</body></html>
