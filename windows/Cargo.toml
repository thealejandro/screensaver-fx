[package]
name = "screensaver-fx"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ScreensaverFX"
path = "src/main.rs"

[dependencies]
ssfx-core = { path = "../core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_Globalization",
]
